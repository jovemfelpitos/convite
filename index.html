<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vicino</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Special+Elite&display=swap');

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #090403;
      color: #f7dfb5;
      font-family: 'Special Elite', monospace;
      overflow: hidden;
    }

    #start, #restaurant {
      min-height: 100dvh;
      width: 100vw;
    }

    #start {
      background:
        linear-gradient(rgba(0,0,0,.42), rgba(0,0,0,.82)),
        url("fundo-italiano-desktop.png");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .intro h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(48px, 14vw, 86px);
      margin: 0;
      color: #ffe1a3;
      letter-spacing: 2px;
    }

    .intro p {
      margin: 12px 0 32px;
      opacity: .9;
      letter-spacing: 2px;
      font-size: 13px;
    }

    button {
      background: rgba(35, 9, 5, .62);
      color: #f7dfb5;
      border: 1px solid #b98245;
      padding: 15px 26px;
      border-radius: 999px;
      font-family: 'Special Elite', monospace;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(185,130,69,.35);
    }

    button:hover {
      background: #b98245;
      color: #160805;
    }

    #restaurant {
      display: none;
      position: relative;
      background:
        linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.48)),
        url("fundo-italiano-desktop.png");
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .topbar {
      position: fixed;
      top: 0;
      width: 100%;
      height: 54px;
      background: rgba(9,4,3,.84);
      border-bottom: 1px solid rgba(185,130,69,.55);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 30;
      letter-spacing: 2px;
      font-size: 10px;
    }

    .hotspot {
      position: absolute;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }

    .hotspot::after {
      content: "";
      position: absolute;
      inset: 18px;
      background: #ffd58a;
      border-radius: 50%;
      box-shadow: 0 0 22px #ffc86b, 0 0 45px rgba(255,200,107,.55);
      animation: pulse 1.8s infinite;
    }

    .hotspot.found::after {
      background: #7b4a24;
      box-shadow: 0 0 12px rgba(255,200,107,.35);
      opacity: .55;
    }

    .hotspot.blink::after {
      animation: strongPulse .45s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(.8); opacity: .65; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(.8); opacity: .65; }
    }

    @keyframes strongPulse {
      0% { transform: scale(.7); opacity: .4; }
      50% { transform: scale(1.45); opacity: 1; }
      100% { transform: scale(.7); opacity: .4; }
    }

    /* POSIÇÕES DESKTOP */
    .wine { top: 42%; left: 12%; }
    .menu { top: 68%; left: 34%; }
    .plate { top: 70%; left: 52%; }
    .candle { top: 48%; left: 64%; }
    .clock { top: 18%; left: 76%; }
    .sign { top: 24%; left: 47%; }
    .door { top: 50%; left: 86%; }

    .clue-box {
      position: fixed;
      left: 50%;
      bottom: 66px;
      transform: translateX(-50%);
      width: 92%;
      min-height: 104px;
      background: rgba(9,4,3,.9);
      border: 1px solid #b98245;
      border-radius: 18px;
      padding: 18px 16px;
      text-align: center;
      z-index: 25;
      box-shadow: 0 0 45px rgba(0,0,0,.75);
    }

    .clue-box h2 {
      margin: 0 0 10px;
      font-family: 'Cormorant Garamond', serif;
      color: #ffe1a3;
      font-size: 30px;
    }

    .clue-box p {
      margin: 0;
      line-height: 1.55;
      font-size: 13px;
    }

    .hint-btn {
      position: fixed;
      right: 14px;
      bottom: 128px;
      z-index: 28;
      padding: 11px 14px;
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    .bottombar {
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 52px;
      background: rgba(9,4,3,.86);
      border-top: 1px solid rgba(185,130,69,.55);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      z-index: 30;
      font-size: 9px;
      letter-spacing: 1.4px;
      gap: 12px;
    }

    .final {
      color: #fff0d0;
      font-size: 15px !important;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      #start {
        background:
          linear-gradient(rgba(0,0,0,.42), rgba(0,0,0,.82)),
          url("fundo-italiano-mobile.png");
        background-size: cover;
        background-position: center top;
      }

      #restaurant {
        background:
          linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.48)),
          url("fundo-italiano-mobile.png");
        background-size: cover;
        background-position: center top;
      }

      .wine { top: 56%; left: 11%; }
      .menu { top: 72%; left: 18%; }
      .plate { top: 72%; left: 48%; }
      .candle { top: 55%; left: 67%; }
      .clock { top: 16%; left: 72%; }
      .sign { top: 24%; left: 42%; }
      .door { top: 42%; left: 80%; }
    }

    /* DESKTOP AJUSTADO */
    @media (min-width: 769px) {
      .topbar {
        height: 58px;
        padding: 0 26px;
        font-size: 13px;
        letter-spacing: 3px;
      }

      .hotspot {
        width: 56px;
        height: 56px;
      }

      .hotspot::after {
        inset: 13px;
      }

      .clue-box {
        bottom: 72px;
        width: min(90%, 560px);
        min-height: 110px;
        padding: 24px;
      }

      .clue-box h2 {
        font-size: 34px;
      }

      .clue-box p {
        font-size: 15px;
      }

      .hint-btn {
        right: 26px;
        bottom: 88px;
      }

      .bottombar {
        height: 52px;
        padding: 0 26px;
        font-size: 12px;
        letter-spacing: 2px;
      }
    }
  </style>
</head>

<body>

  <audio id="italianMusic" loop>
    <source src="italian.mp3" type="audio/mpeg">
  </audio>

  <section id="start">
    <div class="intro">
      <h1>Una Notte</h1>
      <p>uma mesa foi reservada para nós dois.</p>
      <button onclick="enterRestaurant()">ENTRAR</button>
    </div>
  </section>

  <section id="restaurant">
    <div class="topbar">
      <span>☰ CLIQUE NOS DETALHES</span>
      <span>RESERVA CONFIDENCIAL</span>
    </div>

    <div class="hotspot wine" onclick="showClue('wine', this)"></div>
    <div class="hotspot menu" onclick="showClue('menu', this)"></div>
    <div class="hotspot plate" onclick="showClue('plate', this)"></div>
    <div class="hotspot candle" onclick="showClue('candle', this)"></div>
    <div class="hotspot clock" onclick="showClue('clock', this)"></div>
    <div class="hotspot sign" onclick="showClue('sign', this)"></div>
    <div class="hotspot door" onclick="showClue('door', this)"></div>

    <button class="hint-btn" onclick="blinkHotspots()">MOSTRAR PISTAS</button>

    <div class="clue-box">
      <h2>Explore a noite</h2>
      <p>toque nos detalhes dourados. cada um guarda uma parte do caminho.</p>
    </div>

    <div class="bottombar">
      <span>NOW PLAYING: Italian Dinner</span>
      <span id="counter">PISTAS: 0 / 7</span>
    </div>
  </section>

  <script>
    const found = new Set();

    const clues = {
      wine: {
        title: "O vinho",
        text: "alguns brindes não são sobre o que está na taça. são sobre o que está prestes a ser dito."
      },
      menu: {
        title: "O cardápio",
        text: "nem toda escolha importante está escrita no menu. algumas a gente sente antes de entender."
      },
      plate: {
        title: "A mesa",
        text: "existe uma mesa esperando por nós. mas ela não foi reservada só para jantar."
      },
      candle: {
        title: "A luz",
        text: "luz baixa, conversa calma e aquele silêncio bom de quando o coração entende antes da boca."
      },
      clock: {
        title: "O horário",
        text: "quando o dia se aproximar das sete da noite, a próxima cena começa."
      },
      sign: {
        title: "O nome",
        text: "vicino quer dizer perto. e talvez essa seja a pista mais óbvia de todas."
      },
      door: {
        title: "O caminho",
        text: "terça-feira, 05/05. vista algo bonito. o resto eu te mostro no caminho."
      }
    };

    function enterRestaurant() {
      document.getElementById("start").style.display = "none";
      document.getElementById("restaurant").style.display = "block";

      const music = document.getElementById("italianMusic");
      music.volume = 0.42;
      music.play();
    }

    function showClue(type, element) {
      const box = document.querySelector(".clue-box");
      const clue = clues[type];

      found.add(type);
      element.classList.add("found");

      box.innerHTML = `
        <h2>${clue.title}</h2>
        <p>${clue.text}</p>
      `;

      document.getElementById("counter").innerText =
        `PISTAS: ${found.size} / 7`;

      if (found.size === 7) {
        setTimeout(showFinal, 900);
      }
    }

    function blinkHotspots() {
      const hotspots = document.querySelectorAll(".hotspot:not(.found)");
      hotspots.forEach(h => h.classList.add("blink"));

      setTimeout(() => {
        hotspots.forEach(h => h.classList.remove("blink"));
      }, 1800);
    }

    function showFinal() {
      const box = document.querySelector(".clue-box");

      box.innerHTML = `
        <h2>Vicino - Cucina & Vino</h2>
        <p class="final">
          terça-feira, 05/05 — 19:00.<br>
          Guarulhos.<br><br>
          uma mesa, uma noite, nós dois.
        </p>
      `;
    }
  </script>

</body>
</html>
