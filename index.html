<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jazz Night</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Special+Elite&display=swap');

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #050201;
      color: #f6d48a;
      font-family: 'Special Elite', monospace;
      overflow: hidden;
    }

    #start, #club {
      min-height: 100dvh;
      width: 100vw;
    }

    #start {
      background:
        linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.85)),
        url("fundo-jazz-desktop.png");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .intro h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(42px, 13vw, 72px);
      margin: 0;
      color: #ffd77b;
      letter-spacing: 2px;
    }

    .intro p {
      margin: 14px 0 32px;
      opacity: .85;
      letter-spacing: 2px;
      font-size: 13px;
    }

    button {
      background: rgba(0,0,0,.55);
      color: #f6d48a;
      border: 1px solid #c69236;
      padding: 15px 26px;
      border-radius: 999px;
      font-family: 'Special Elite', monospace;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(198,146,54,.35);
    }

    #club {
      display: none;
      position: relative;
      background:
        linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.45)),
        url("fundo-jazz-desktop.png");
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .topbar {
      position: fixed;
      top: 0;
      width: 100%;
      height: 54px;
      background: rgba(5,2,1,.82);
      border-bottom: 1px solid rgba(198,146,54,.55);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 30;
      letter-spacing: 2px;
      font-size: 10px;
    }

    .hotspot {
      position: absolute;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }

    .hotspot::after {
      content: "";
      position: absolute;
      inset: 18px;
      background: #ffe19a;
      border-radius: 50%;
      box-shadow: 0 0 22px #ffcf61, 0 0 45px rgba(255,207,97,.55);
      animation: pulse 1.8s infinite;
    }

    .hotspot.found::after {
      background: #8a5d22;
      box-shadow: 0 0 12px rgba(255,207,97,.35);
      opacity: .55;
    }

    .hotspot.blink::after {
      animation: strongPulse .45s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(.8); opacity: .65; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(.8); opacity: .65; }
    }

    @keyframes strongPulse {
      0% { transform: scale(.7); opacity: .4; }
      50% { transform: scale(1.45); opacity: 1; }
      100% { transform: scale(.7); opacity: .4; }
    }

    /* POSIÇÕES DESKTOP */
    .sax { top: 37%; left: 3%; }
    .frame { top: 38%; left: 16%; }
    .logo { top: 23%; left: 53%; }
    .clock { top: 15%; left: 78%; }
    .wine { top: 38%; left: 91%; }
    .bottle { top: 77%; left: 20%; }
    .menu { top: 71%; left: 49%; }

    .clue-box {
      position: fixed;
      left: 50%;
      bottom: 66px;
      transform: translateX(-50%);
      width: 92%;
      min-height: 104px;
      background: rgba(5,2,1,.88);
      border: 1px solid #c69236;
      border-radius: 18px;
      padding: 18px 16px;
      text-align: center;
      z-index: 25;
      box-shadow: 0 0 45px rgba(0,0,0,.75);
    }

    .clue-box h2 {
      margin: 0 0 10px;
      font-family: 'Playfair Display', serif;
      color: #ffd77b;
      font-size: 24px;
    }

    .clue-box p {
      margin: 0;
      line-height: 1.55;
      font-size: 13px;
    }

    .hint-btn {
      position: fixed;
      right: 14px;
      bottom: 128px;
      z-index: 28;
      padding: 11px 14px;
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    .bottombar {
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 52px;
      background: rgba(5,2,1,.84);
      border-top: 1px solid rgba(198,146,54,.55);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      z-index: 30;
      font-size: 9px;
      letter-spacing: 1.4px;
      gap: 12px;
    }

    .final {
      color: #fff0c7;
      font-size: 15px !important;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      #start {
        background:
          linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.85)),
          url("fundo-jazz-mobile.png");
        background-size: cover;
        background-position: center top;
      }

      #club {
        background:
          linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.45)),
          url("fundo-jazz-mobile.png");
        background-size: cover;
        background-position: center top;
      }

      .hotspot {
        width: 66px;
        height: 66px;
      }

      /* POSIÇÕES MOBILE */
      .sax { top: 41%; left: 8%; }
      .frame { top: 34%; left: 13%; }
      .logo { top: 25%; left: 44%; }
      .clock { top: 17%; left: 72%; }
      .wine { top: 67%; left: 75%; }
      .bottle { top: 77%; left: 14%; }
      .menu { top: 92%; left: 47%; }

      .clue-box {
        bottom: 66px;
        width: 92%;
        min-height: 104px;
        padding: 18px 16px;
      }

      .hint-btn {
        right: 14px;
        bottom: 128px;
      }
    }

    /* DESKTOP AJUSTADO */
    @media (min-width: 769px) {
      .topbar {
        height: 58px;
        padding: 0 26px;
        font-size: 13px;
        letter-spacing: 3px;
      }

      .hotspot {
        width: 56px;
        height: 56px;
      }

      .hotspot::after {
        inset: 13px;
      }

      .clue-box {
        bottom: 72px;
        width: min(90%, 560px);
        min-height: 110px;
        padding: 24px;
      }

      .clue-box h2 {
        font-size: 26px;
      }

      .clue-box p {
        font-size: 15px;
      }

      .hint-btn {
        right: 26px;
        bottom: 88px;
      }

      .bottombar {
        height: 52px;
        padding: 0 26px;
        font-size: 12px;
        letter-spacing: 2px;
      }
    }
  </style>
</head>

<body>

  <audio id="jazzMusic" loop>
    <source src="jazz.mp3" type="audio/mpeg">
  </audio>

  <section id="start">
    <div class="intro">
      <h1>Jazz Night</h1>
      <p>uma noite foi reservada para nós dois.</p>
      <button onclick="enterClub()">ENTRAR NO CLUBE</button>
    </div>
  </section>

  <section id="club">
    <div class="topbar">
      <span>☰ CLIQUE NOS DETALHES</span>
      <span>VOLUME ▮▮▮▮▮▮ ♫</span>
    </div>

    <div class="hotspot sax" onclick="showClue('sax', this)"></div>
    <div class="hotspot frame" onclick="showClue('frame', this)"></div>
    <div class="hotspot logo" onclick="showClue('logo', this)"></div>
    <div class="hotspot clock" onclick="showClue('clock', this)"></div>
    <div class="hotspot wine" onclick="showClue('wine', this)"></div>
    <div class="hotspot bottle" onclick="showClue('bottle', this)"></div>
    <div class="hotspot menu" onclick="showClue('menu', this)"></div>

    <button class="hint-btn" onclick="blinkHotspots()">MOSTRAR PISTAS</button>

    <div class="clue-box">
      <h2>Explore o clube</h2>
      <p>toque nos detalhes dourados da noite. cada um guarda uma pequena pista.</p>
    </div>

    <div class="bottombar">
      <span>NOW PLAYING: So What - Miles Davis</span>
      <span id="counter">PISTAS: 0 / 7</span>
    </div>
  </section>

  <script>
    const found = new Set();

    const clues = {
      sax: {
        title: "O som",
        text: "onde o som não é fundo. é personagem."
      },
      frame: {
        title: "A lembrança",
        text: "algumas noites parecem cena de filme antes mesmo de começarem."
      },
      logo: {
        title: "O nome",
        text: "procure por um nome que também pertence a um homem que fez o jazz respirar."
      },
      clock: {
        title: "O horário",
        text: "quando os ponteiros encontrarem o oito, a noite começa."
      },
      wine: {
        title: "O brinde",
        text: "não é só sobre vinho. é sobre brindar algo que ainda não foi dito."
      },
      bottle: {
        title: "O lugar",
        text: "entre taças, luz baixa e música viva, existe uma mesa esperando por nós."
      },
      menu: {
        title: "O convite",
        text: "terça-feira, 05/05. vista algo bonito. o resto eu te conto no caminho."
      }
    };

    function enterClub() {
      document.getElementById("start").style.display = "none";
      document.getElementById("club").style.display = "block";

      const music = document.getElementById("jazzMusic");
      music.volume = 0.42;
      music.play();
    }

    function showClue(type, element) {
      const box = document.querySelector(".clue-box");
      const clue = clues[type];

      found.add(type);
      element.classList.add("found");

      box.innerHTML = `
        <h2>${clue.title}</h2>
        <p>${clue.text}</p>
      `;

      document.getElementById("counter").innerText =
        `PISTAS: ${found.size} / 7`;

      if (found.size === 7) {
        setTimeout(showFinal, 900);
      }
    }

    function blinkHotspots() {
      const hotspots = document.querySelectorAll(".hotspot:not(.found)");
      hotspots.forEach(h => h.classList.add("blink"));

      setTimeout(() => {
        hotspots.forEach(h => h.classList.remove("blink"));
      }, 1800);
    }

    function showFinal() {
      const box = document.querySelector(".clue-box");

      box.innerHTML = `
        <h2>Miles Wine & Jazz Bar</h2>
        <p class="final">
          terça-feira, 05/05 — 20:00.<br><br>
          uma mesa, uma música, uma noite nossa.
        </p>
      `;
    }
  </script>

</body>
</html>
